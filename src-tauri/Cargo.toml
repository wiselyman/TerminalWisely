[package]
name = "terminal-wisely"
version = "0.0.9"
description = "Cross-platform terminal with SSH and SFTP"
authors = ["WangYunfei"]
edition = "2021"
default-run = "TerminalWisely"

[[bin]]
name = "TerminalWisely"
path = "src/main.rs"

[lib]
name = "terminal_wisely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = false

[features]
integration-tests = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "macos-private-api", "macos-proxy", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
once_cell = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2.0"
futures = "0.3"
dirs = "6"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "2", features = ["deflate"] }
portable-pty = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
sqlparser = { version = "0.55", features = ["visitor"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
aes-gcm = "0.10"
rand = "0.8"
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["aws-lc-rs", "native-certs"] }
rustls = "0.23.45"
rustls-native-certs = "0.8.4"
mysql_async = { version = "0.37.1", features = ["default-rustls"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp"] }
mongodb = "3"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "chrono", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
oracledb = "26.0.0-beta.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[target.'cfg(windows)'.dependencies]
netstat2 = "0.11"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
