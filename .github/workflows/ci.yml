name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  author-guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject Cursor attribution in git history
        run: bash scripts/verify-git-authors.sh

  test:
    name: test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — full automated suite (incl. Playwright)
          - label: linux-x86_64
            os: ubuntu-22.04
            apt_deps: true
            rust_mode: test
            ssh_live: true
            pytest: true
            eval: true
            playwright: true
          # Linux ARM64 — native tests on aarch64 runner
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            apt_deps: true
            rust_mode: test
            pytest: true
            eval: true
            playwright: true
          # macOS Apple Silicon — native + Intel cross-check
          - label: macos-aarch64
            os: macos-latest
            rust_mode: test
            rust_cross_x64: true
            pytest: true
            eval: true
            cross_arch: true
          # Windows x86_64 — frontend + pytest + native/cross Rust check
          - label: windows-x86_64
            os: windows-latest
            rust_mode: check
            rust_cross_arm64: true
            pytest: true
            cross_arch: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.apt_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend static smoke
        run: npm run test:smoke

      - name: Frontend unit tests
        run: npm test -- --run

      - name: Typecheck and build frontend
        run: npm run build

      - name: Rust unit tests
        if: matrix.rust_mode == 'test'
        working-directory: src-tauri
        run: cargo test --quiet

      - name: SSH live integration (Docker openssh)
        if: matrix.ssh_live
        run: bash scripts/e2e-ssh-integration.sh

      - name: Rust cross-check Intel (macOS host)
        if: matrix.rust_cross_x64
        working-directory: src-tauri
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --quiet --target x86_64-apple-darwin

      - name: Rust native check (Windows)
        if: matrix.rust_mode == 'check'
        working-directory: src-tauri
        run: cargo check --quiet

      - name: Rust cross-check ARM64 (Windows host)
        if: matrix.rust_cross_arm64
        working-directory: src-tauri
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check --quiet --target aarch64-pc-windows-msvc

      - name: Cross-arch Rust check
        if: matrix.cross_arch
        run: bash scripts/cross-arch-rust-check.sh

      - name: Agent sidecar pytest (Unix)
        if: matrix.pytest && runner.os != 'Windows'
        run: bash scripts/run-sidecar-pytest.sh

      - name: Agent sidecar pytest (Windows)
        if: matrix.pytest && runner.os == 'Windows'
        working-directory: agent-sidecar
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install -q -U pip
          python -m pip install -q -r requirements.txt
          $env:PYTHONPATH = "."
          python -m pytest tests/ -q --tb=line

      - name: Ops eval harness (functional)
        if: matrix.eval
        working-directory: agent-sidecar
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            .venv/Scripts/activate
          else
            . .venv/bin/activate
          fi
          PYTHONPATH=. python -m eval --report /tmp/ops_eval_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("/tmp/ops_eval_report.json").read_text())["summary"]
          assert s["passed"] == s["total"] and s["failed"] == 0, s
          print(f"Eval {s['passed']}/{s['total']} passed")
          PY

      - name: Install Playwright Chromium
        if: matrix.playwright
        run: npx playwright install chromium --with-deps

      - name: Playwright UI E2E
        if: matrix.playwright
        run: bash scripts/e2e-playwright.sh
