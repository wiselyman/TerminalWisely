name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  author-guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject Cursor attribution in git history
        run: bash scripts/verify-git-authors.sh

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check

      - name: Agent sidecar unit tests
        if: matrix.os != 'windows-latest'
        working-directory: agent-sidecar
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install -q -U pip
          python -m pip install -q -r requirements.txt
          PYTHONPATH=. python -m pytest tests/ -q --tb=line
