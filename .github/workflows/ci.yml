name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  author-guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject Cursor attribution in git history
        run: bash scripts/verify-git-authors.sh

  test:
    name: test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — full automated suite (incl. Playwright)
          - label: linux-x86_64
            os: ubuntu-22.04
            apt_deps: true
            rust_mode: test
            ssh_live: true
            k8s_live: true
            pytest: true
            playwright: true
          # Linux ARM64 — native tests on aarch64 runner
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            apt_deps: true
            rust_mode: test
            ssh_live: true
            k8s_live: true
            pytest: true
            playwright: true
          # macOS Apple Silicon — native + Intel cross-check
          - label: macos-aarch64
            os: macos-latest
            rust_mode: test
            rust_cross_x64: true
            pytest: true
            cross_arch: true
          # Windows x86_64 — frontend + pytest + native/cross Rust check
          - label: windows-x86_64
            os: windows-latest
            rust_mode: check
            rust_cross_arm64: true
            pytest: true
            playwright: true
            cross_arch: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.apt_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend static smoke
        run: npm run test:smoke

      - name: Frontend unit tests
        run: npm test -- --run

      - name: Windows Coreutils provisioning tests
        if: matrix.label == 'windows-x86_64'
        shell: powershell
        run: node --test scripts/fetch-windows-coreutils.test.mjs

      - name: Prepare Windows Coreutils x64 bundle
        if: matrix.label == 'windows-x86_64'
        shell: powershell
        run: ./scripts/fetch-windows-coreutils.ps1 -Architecture x64

      - name: Verify PowerShell 5.1 resolves bundled Coreutils without global changes
        if: matrix.label == 'windows-x86_64'
        shell: powershell
        run: ./scripts/test-windows-coreutils-package.ps1 -RequireRunnableBinary

      - name: Typecheck and build frontend
        run: npm run build

      - name: Rust unit tests
        if: matrix.rust_mode == 'test'
        working-directory: src-tauri
        run: cargo test --quiet

      - name: SSH live integration (Docker openssh)
        if: matrix.ssh_live
        run: bash scripts/e2e-ssh-integration.sh

      - name: Install k3d
        if: matrix.k8s_live
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: K8s live integration (k3d)
        if: matrix.k8s_live
        run: bash scripts/e2e-k8s-integration.sh

      - name: Rust cross-check Intel (macOS host)
        if: matrix.rust_cross_x64
        working-directory: src-tauri
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --quiet --target x86_64-apple-darwin

      - name: Rust native check (Windows)
        if: matrix.rust_mode == 'check'
        working-directory: src-tauri
        run: cargo check --quiet

      - name: Rust cross-check ARM64 (Windows host)
        if: matrix.rust_cross_arm64
        working-directory: src-tauri
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check --quiet --target aarch64-pc-windows-msvc

      - name: Cross-arch Rust check
        if: matrix.cross_arch
        run: bash scripts/cross-arch-rust-check.sh

      - name: Agent sidecar pytest (Unix)
        if: matrix.pytest && runner.os != 'Windows'
        run: bash scripts/run-sidecar-pytest.sh

      - name: Agent sidecar pytest (Windows)
        if: matrix.pytest && runner.os == 'Windows'
        working-directory: agent-sidecar
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install -q -U pip
          python -m pip install -q -r requirements.txt
          $env:PYTHONPATH = "."
          python -m pytest tests/ -q --tb=line

      - name: Install Playwright Chromium (Linux)
        if: matrix.playwright && runner.os == 'Linux'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright Chromium (Windows)
        if: matrix.playwright && runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Playwright UI E2E (Unix)
        if: matrix.playwright && runner.os != 'Windows'
        run: bash scripts/e2e-playwright.sh

      - name: Playwright UI E2E (Windows)
        if: matrix.playwright && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/e2e-playwright.ps1

  db-live:
    name: database live
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: twreview
          POSTGRES_PASSWORD: twtest
          POSTGRES_DB: twreview
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U twreview"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: twtest
          MYSQL_DATABASE: twreview
          MYSQL_USER: twreview
          MYSQL_PASSWORD: twtest
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -utwreview -ptwtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Live database driver
        working-directory: src-tauri
        env:
          TW_DB_PG_HOST: 127.0.0.1
          TW_DB_PG_PORT: "15432"
          TW_DB_MY_HOST: 127.0.0.1
          TW_DB_MY_PORT: "13306"
          TW_DB_USER: twreview
          TW_DB_NAME: twreview
          TW_DB_PASSWORD: twtest
        run: cargo test --lib db::driver::tests::live_postgres_and_mysql_match_the_security_contract -- --ignored --test-threads=1
